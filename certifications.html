<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certifications | Sanjana Kumari</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;scroll-behavior:smooth}
    body{
      margin:0;
      font-family:'Orbitron',sans-serif;
      color:#eaf2ff;
      background:#020814;
    }

    #bgVideo{
      position:fixed; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      z-index:-3;
      filter:saturate(1.1) contrast(1.05);
    }

    .video-overlay{
      position:fixed; inset:0;
      background:linear-gradient(120deg,
        rgba(5,15,35,.70),
        rgba(10,26,47,.50),
        rgba(31,78,140,.35)
      );
      z-index:-2;
      animation:hue 10s linear infinite;
    }
    @keyframes hue{to{filter:hue-rotate(360deg)}}

    .scanlines{
      position:fixed; inset:0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.03),
        rgba(255,255,255,.03) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode:overlay;
      z-index:-1;
      pointer-events:none;
    }

    .navbar{
      position:sticky; top:0; z-index:10;
      background:rgba(5,15,35,.85);
      backdrop-filter: blur(10px);
      border-bottom:1px solid #1F4E8C;
      padding:12px; text-align:center;
    }
    .navbar a{
      color:#fff;
      text-decoration:none;
      margin:0 14px;
      letter-spacing:2px;
      text-transform:uppercase;
      text-shadow:0 0 10px #1F4E8C;
    }

    .hero-title{
      text-align:center;
      padding:70px 20px 10px;
    }
    .hero-title h1{
      margin:0;
      font-size:38px;
      letter-spacing:3px;
      color:#fff;
      text-shadow:0 0 8px #fff, 0 0 18px #1F4E8C, 0 0 40px #0A1A2F;
    }
    .hero-title p{
      margin:12px 0 0;
      color:#cfe3ff;
      letter-spacing:1px;
    }

    .card{
      width:90%;
      max-width:1100px;
      margin:28px auto;
      padding:22px;
      background:rgba(10,20,45,.55);
      backdrop-filter: blur(14px);
      border-radius:14px;
      border:1px solid rgba(31,78,140,.65);
      box-shadow:0 0 25px rgba(31,78,140,.35);
    }

    .cert-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
      gap:18px;
      margin-top:18px;
    }

    .cert-card{
      border:1px solid rgba(31,78,140,.7);
      border-radius:14px;
      background:rgba(2,8,20,.55);
      padding:12px;
      transition:.25s;
      box-shadow:0 0 16px rgba(31,78,140,.25);
      text-decoration:none;
    }

    .cert-card:hover{
      transform:translateY(-8px);
      box-shadow:0 0 30px rgba(31,78,140,.85);
    }

    .cert-card img{
      width:100%;
      border-radius:12px;
      display:block;
      border:1px solid rgba(31,78,140,.55);
      transition:.25s;
    }

    .cert-card:hover img{
      transform:scale(1.02);
    }

    .cert-name{
      margin-top:12px;
      font-size:14px;
      letter-spacing:1px;
      color:#dbe8ff;
      text-align:center;
    }

    .back-btn{
      display:inline-block;
      margin-top:16px;
      padding:10px 16px;
      border-radius:12px;
      border:1px solid #1F4E8C;
      color:#fff;
      text-decoration:none;
      letter-spacing:2px;
      box-shadow:0 0 14px rgba(31,78,140,.7);
      background:rgba(2,8,20,.6);
      transition:.25s;
    }
    .back-btn:hover{
      transform:translateY(-2px);
      background:#1F4E8C;
    }

    footer{
      text-align:center;
      padding:22px;
      letter-spacing:2px;
      color:#9fc7ff;
    }
  </style>
</head>

<body>

  <video autoplay muted loop id="bgVideo">
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>
  <div class="scanlines"></div>

  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="certifications.html">Certifications</a>
    <a href="index.html#projects">Projects</a>
  </div>

  <div class="hero-title">
    <h1>CERTIFICATIONS</h1>
    <p>Click any certificate to open full view ✅</p>
  </div>

  <div class="card">
    <div class="cert-grid">

      <!-- ✅ Update cert1.jpg..certN.jpg -->
      <a class="cert-card" href="certificates/cert1.jpg" target="_blank">
        <img src="certificates/cert1.jpg" alt="Certificate 1">
        <div class="cert-name">Certificate 1</div>
      </a>

      <a class="cert-card" href="certificates/cert2.jpg" target="_blank">
        <img src="certificates/cert2.jpg" alt="Certificate 2">
        <div class="cert-name">Certificate 2</div>
      </a>

      <a class="cert-card" href="certificates/cert3.jpg" target="_blank">
        <img src="certificates/cert3.jpg" alt="Certificate 3">
        <div class="cert-name">Certificate 3</div>
      </a>

      <a class="cert-card" href="certificates/cert4.jpg" target="_blank">
        <img src="certificates/cert4.jpg" alt="Certificate 4">
        <div class="cert-name">Certificate 4</div>
      </a>

    </div>

    <div style="text-align:center;">
      <a class="back-btn" href="index.html">← Back to Home</a>
    </div>
  </div>

  <footer>© 2026 SANJANA KUMARI | AI GAMING PORTFOLIO</footer>

</body>
</html>
